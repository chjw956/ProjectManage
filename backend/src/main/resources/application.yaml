spring:
  application:
    name: projtrack
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /v3/api-docs
    disable-swagger-default-url: true

nas:
  allowed-roots:
    - /mnt/nas

onlyoffice:
  server-url: http://localhost:8081
  callback-host: http://localhost:8080
